services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: personal-rag-chatbot

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    volumes:
      - .:/workspace

    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload